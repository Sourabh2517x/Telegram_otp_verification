{% load static %}
<!DOCTYPE html>
<html>

<head>
    <title>Home Page</title>
    <link rel="stylesheet" href="{% static 'users/index.css' %}">
</head>

<body>

    <div class="container">

        {% if user.is_authenticated %}
        <h1>Welcome Back </h1>
        <p>You are successfully logged in to your account.</p>
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="button logout">Log Out</button>
        </form>
        {% else %}
        <h1>Hello </h1>
        <p>Please login or create a new account to continue.</p>
        <a href="{% url 'login' %}" class="button">Login</a>
        <a href="{% url 'register' %}" class="button">Register</a>
        {% endif %}

    </div>

</body>

</html>
